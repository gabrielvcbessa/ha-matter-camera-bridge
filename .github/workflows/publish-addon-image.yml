name: Publish Home Assistant add-on image

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-addon-image.yml"
      - "stream-to-matter/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build and publish add-on image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./stream-to-matter
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            BUILD_VERSION=0.1.29
          tags: |
            ghcr.io/gabrielvcbessa/ha-matter-camera-bridge:0.1.29
            ghcr.io/gabrielvcbessa/ha-matter-camera-bridge:latest
